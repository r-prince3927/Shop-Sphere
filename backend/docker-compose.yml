services:

  db:

    image: postgres:16

    container_name: shopsphere_db

    restart: always

    environment:

      POSTGRES_DB: shopsphere

      POSTGRES_USER: postgres

      POSTGRES_PASSWORD: Prince@123

    ports:

      - "5432:5432"

    volumes:

      - postgres_data:/var/lib/postgresql/data

  web:

    build: .

    container_name: shopsphere_backend

    command: python manage.py runserver 0.0.0.0:8000

    volumes:

      - .:/app

    ports:

      - "8000:8000"

    env_file:

      - .env

    depends_on:

      - db

volumes:

  postgres_data: